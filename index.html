<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workshop & Event Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-full flex flex-col antialiased">

<header class="sticky top-0 z-30 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white">
                    <i class="fa-solid font-bold fa-calendar-check text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-blue-600">EventPulse</h1>
                    <p class="text-xs text-slate-500 hidden sm:block">Workshop & Masterclass Hub</p>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <section class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6 sm:p-8 rounded-2xl">
        <h2 class="text-2xl sm:text-3xl font-bold">Workshops & Tech Events</h2>
        <p class="text-blue-100 text-sm">Discover hands-on masterclasses and live bootcamps.</p>
    </section>

    <!-- Content Placeholder -->
    <section id="events-grid"></section>
</main>

<footer class="mt-auto border-t border-slate-200 py-6 bg-white text-xs text-slate-500 text-center">
    <p>© 2026 EventPulse Hub</p>
</footer>
</body>
</html>
